server:
  port: 8080
  servlet:
    context-path: /auth
  forward-headers-strategy: native

spring:
  application:
    name: camunda-demo-identity-provider
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  sql:
    init:
      mode: always
      # Our own users table, plus a PostgreSQL-adapted copy of Spring Authorization Server's
      # official schema for JdbcOAuth2AuthorizationService (issued tokens survive a restart /
      # are shared across replicas instead of living in one pod's memory). Adapted, not used
      # directly, because the packaged schema uses "blob"/"timestamp", which the schema file's
      # own comment says to change to "text"/"timestamptz" for PostgreSQL.
      schema-locations:
        - classpath:users-migration-postgresql.sql
        - classpath:schema.sql
        - classpath:oauth2-authorization-schema-postgresql.sql
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

identity-provider:
  camunda-domain: ${CAMUNDA_DOMAIN}
  # PEM-encoded PKCS8 RSA private key, shared across replicas and stable across restarts, so
  # already-issued tokens keep validating. If unset (local dev only), a fresh ephemeral key is
  # generated at startup - fine for one instance, wrong for anything with more than one replica.
  jwt-signing-key-pem: ${IDENTITY_PROVIDER_JWT_SIGNING_KEY_PEM:}
  demo-user:
    name: ${DEMO_NAME:Demo User}
    email: ${DEMO_EMAIL:demo@example.com}
    password: ${DEMO_PASSWORD:demo}
  clients:
    identity:
      secret: ${IDENTITY_IDENTITY_CLIENT_TOKEN}
      audience: camunda-identity-resource-server
    orchestration:
      secret: ${IDENTITY_ORCHESTRATION_CLIENT_TOKEN}
      audience: orchestration-api
    connectors:
      secret: ${IDENTITY_CONNECTORS_CLIENT_TOKEN}
      audience: orchestration-api
    optimize:
      secret: ${IDENTITY_OPTIMIZE_CLIENT_TOKEN}
      audience: optimize-api
    web-modeler:
      client-api-audience: web-modeler-api
      public-api-audience: web-modeler-public-api

logging:
  level:
    org.springframework.security: INFO
