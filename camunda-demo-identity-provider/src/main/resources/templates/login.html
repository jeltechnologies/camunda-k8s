<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Demo Identity provider | Sign in</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 320px;
            border: 1px solid var(--gray-20);
            padding: 2rem;
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }
        .login-brand img {
            width: 28px;
            height: 28px;
        }
        .login-brand span {
            font-weight: 600;
            font-size: 15px;
        }
        h1 {
            font-size: 1rem;
            margin-bottom: 1.25rem;
        }
        .login-card input {
            margin-bottom: 1.1rem;
        }
        .login-card button {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <img th:src="@{/images/c-logo.png}" alt="Camunda"/>
            <span>Demo Identity provider</span>
        </div>
        <h1>Welcome to Camunda</h1>
        <p class="error" th:if="${param.error}">Invalid email or password.</p>
        <form method="post" th:action="@{/login}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${lastEmail}"
                   th:autofocus="${#strings.isEmpty(lastEmail)}" autocomplete="email"/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   th:autofocus="${!#strings.isEmpty(lastEmail)}" autocomplete="current-password"/>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
