<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sign in - Camunda Identity Provider</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex;
               justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem 2.5rem; border-radius: 8px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.15); width: 320px; }
        h1 { font-size: 1.25rem; margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; color: #333; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box;
                border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.6rem; background: #333; color: white; border: none;
                 border-radius: 4px; cursor: pointer; }
        .error { color: #b00020; font-size: 0.875rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign in</h1>
        <p class="error" th:if="${param.error}">Invalid username or password.</p>
        <form method="post" th:action="@{/login}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus="autofocus"/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password"/>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
