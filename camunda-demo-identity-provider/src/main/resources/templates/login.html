<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda Demo Identity Provider</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .login-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 320px;
            border: 1px solid var(--gray-20);
            padding: 2rem;
        }
        h1 {
            font-size: 1rem;
            margin-bottom: 1.25rem;
        }
        .login-card input {
            margin-bottom: 1.1rem;
        }
        .login-card button {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="logo" th:href="@{/admin/users}">
            <img th:src="@{/images/c-logo.png}" alt="Camunda"/>
            <span class="app-name">Demo Sign In</span>
        </a>
        <div class="right">
            <a class="btn-secondary" th:href="@{/admin/users}">Manage Users</a>
        </div>
    </div>

    <div class="login-content">
        <div class="login-card">
            <h1 th:text="${manageUsersFlow} ? 'User Management' : 'Welcome to Camunda'">Welcome to Camunda</h1>
            <p class="error" th:if="${param.error}">Invalid email or password.</p>
            <form method="post" th:action="@{/login}">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${lastEmail}"
                       th:autofocus="${#strings.isEmpty(lastEmail)}" autocomplete="email"/>
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       th:autofocus="${!#strings.isEmpty(lastEmail)}" autocomplete="current-password"/>
                <button type="submit">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
