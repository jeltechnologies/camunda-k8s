<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda | Demo Identity Provider</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .panel-header h1 {
            margin: 0;
        }
        .edit-link {
            font-size: 13px;
            color: var(--blue-60);
            text-decoration: none;
        }
        .edit-link:hover {
            text-decoration: underline;
        }
        code {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 13px;
        }
        table {
            table-layout: fixed;
        }
        .col-name, .col-client-id {
            width: 15%;
        }
        .col-actions {
            width: 60px;
        }
        td.col-name, td.col-client-id {
            white-space: nowrap;
            overflow-x: auto;
        }
        .audience-list {
            margin: 0;
            padding-left: 1.1rem;
        }
        .audience-list li {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 13px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="logo" th:href="@{/admin/users}">
            <img th:src="@{/images/c-logo.png}" alt="Camunda"/>
            <span class="app-name">Demo Identity provider</span>
        </a>
        <nav>
            <a th:href="@{/admin/users}">Users</a>
            <a href="#" class="active">Clients</a>
        </nav>
        <div class="right">
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="btn-secondary">Logout</button>
            </form>
        </div>
    </div>

    <div class="content">
        <div class="panel">
            <div class="panel-header">
                <h1>Clients</h1>
                <a class="btn" th:href="@{/admin/clients/new}">Add client</a>
            </div>
            <p class="message" th:if="${message}" th:text="${message}"></p>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <table>
                <thead>
                    <tr><th class="col-name">Name</th><th class="col-client-id">Client ID</th><th>Audience</th><th class="col-actions"></th></tr>
                </thead>
                <tbody>
                    <tr th:each="client : ${clients}">
                        <td class="col-name" th:text="${client.name}"></td>
                        <td class="col-client-id"><code th:text="${client.clientId}"></code></td>
                        <td>
                            <ul class="audience-list" th:if="${client.audience}">
                                <li th:each="aud : ${#strings.listSplit(client.audience, ',')}" th:text="${#strings.trim(aud)}"></li>
                            </ul>
                            <span th:unless="${client.audience}">-</span>
                        </td>
                        <td><a class="edit-link" th:href="@{/admin/clients/{id}/edit(id=${client.id})}">Edit</a></td>
                    </tr>
                </tbody>
            </table>
            <a class="btn-secondary" style="margin-top: 1.5rem;" th:href="${consoleUrl}">Back to Camunda</a>
        </div>
    </div>
</body>
</html>
