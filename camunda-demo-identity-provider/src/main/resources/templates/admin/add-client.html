<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda - Add client</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .form-panel {
            max-width: 420px;
        }
        .form-panel label {
            margin-top: 1rem;
        }
        .form-panel label:first-of-type {
            margin-top: 0;
        }
        .note {
            font-size: 13px;
            color: #565656;
            margin-top: 0.3rem;
        }
        .button-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .btn-cancel {
            padding: 0.55rem 1rem;
            background: #ffffff;
            color: var(--gray-100);
            border: 1px solid var(--gray-20);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">
            <img th:src="@{/images/c-logo.png}" alt="Camunda"/>
            <span class="app-name">Demo Identity provider</span>
        </div>
        <nav>
            <a th:href="@{/admin/users}">Users</a>
            <a th:href="@{/admin/clients}" class="active">Clients</a>
        </nav>
    </div>

    <div class="content">
        <div class="panel form-panel">
            <h1>Add client</h1>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <form method="post" th:action="@{/admin/clients}">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required="required" autofocus="autofocus"/>

                <label for="clientId">Client ID</label>
                <input type="text" id="clientId" name="clientId" required="required" pattern="[a-zA-Z0-9._-]+"/>
                <p class="note">
                    What other systems authenticate as - letters, digits, ".", "_" or "-". Cannot be changed later.
                </p>

                <div class="button-row">
                    <button type="submit">OK</button>
                    <a class="btn-cancel" th:href="@{/admin/clients}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
