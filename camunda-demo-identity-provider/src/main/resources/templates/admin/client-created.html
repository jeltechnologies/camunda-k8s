<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda - Client secret</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .form-panel {
            max-width: 480px;
        }
        .form-panel label {
            margin-top: 1rem;
        }
        .form-panel label:first-of-type {
            margin-top: 0;
        }
        .secret-value {
            display: block;
            width: 100%;
            padding: 0.55rem 0.65rem;
            border: 1px solid var(--gray-20);
            background: var(--gray-10);
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 13px;
            word-break: break-all;
        }
        .button-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">
            <img th:src="@{/images/c-logo.png}" alt="Camunda"/>
            <span class="app-name">Demo Identity provider</span>
        </div>
        <nav>
            <a th:href="@{/admin/users}">Users</a>
            <a th:href="@{/admin/clients}" class="active">Clients</a>
        </nav>
    </div>

    <div class="content">
        <div class="panel form-panel">
            <h1>Client secret</h1>
            <p class="error">
                Copy this secret now - it is shown only once and cannot be retrieved later. If it's
                lost, use "Regenerate secret" on the client's edit page to issue a new one.
            </p>

            <label>Client ID</label>
            <span class="secret-value" th:text="${clientId}"></span>

            <label>Client secret</label>
            <span class="secret-value" th:text="${secret}"></span>

            <div class="button-row">
                <a class="btn" th:href="@{/admin/clients}">Done</a>
            </div>
        </div>
    </div>
</body>
</html>
