<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Users - Camunda Identity Provider</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 2rem; }
        .panel { background: white; padding: 1.5rem 2rem; border-radius: 8px;
                 box-shadow: 0 1px 4px rgba(0,0,0,0.15); max-width: 720px; margin: 0 auto 1.5rem; }
        h1 { font-size: 1.25rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        form.inline { display: inline; }
        input { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.4rem 0.75rem; border: none; border-radius: 4px; background: #333;
                 color: white; cursor: pointer; }
        button.danger { background: #b00020; }
        .message { color: #1a7f37; margin-bottom: 1rem; }
        .error { color: #b00020; margin-bottom: 1rem; }
        .add-form input { margin-right: 0.5rem; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Users</h1>
        <p class="message" th:if="${message}" th:text="${message}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <table>
            <thead>
                <tr><th>Username</th><th>Email</th><th>Admin</th><th>Reset password</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.admin} ? 'yes' : 'no'"></td>
                    <td>
                        <form class="inline" method="post" th:action="@{/admin/users/{id}/reset-password(id=${user.id})}">
                            <input type="password" name="password" placeholder="new password" required="required"/>
                            <button type="submit">Set</button>
                        </form>
                    </td>
                    <td>
                        <form class="inline" method="post" th:action="@{/admin/users/{id}/delete(id=${user.id})}">
                            <button type="submit" class="danger">Remove</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="panel">
        <h2>Add user</h2>
        <form class="add-form" method="post" th:action="@{/admin/users}">
            <input type="text" name="username" placeholder="username" required="required"/>
            <input type="email" name="email" placeholder="email" required="required"/>
            <input type="password" name="password" placeholder="password" required="required"/>
            <label><input type="checkbox" name="admin" value="true"/> admin</label>
            <button type="submit">Add</button>
        </form>
    </div>
</body>
</html>
