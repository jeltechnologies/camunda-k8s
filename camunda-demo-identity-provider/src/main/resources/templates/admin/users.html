<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Demo Identity provider | Users</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .panel-header h1 {
            margin: 0;
        }
        .edit-link {
            margin-left: 0.75rem;
            font-size: 13px;
            color: var(--blue-60);
            text-decoration: none;
        }
        .edit-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">
            <img th:src="@{/images/c-logo.png}" alt="Camunda"/>
            <span class="app-name">Demo Identity provider</span>
        </div>
        <nav>
            <a href="#" class="active">Users</a>
        </nav>
    </div>

    <div class="content">
        <div class="panel">
            <div class="panel-header">
                <h1>Users</h1>
                <a class="btn" th:href="@{/admin/users/new}">Add user</a>
            </div>
            <p class="message" th:if="${message}" th:text="${message}"></p>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <table>
                <thead>
                    <tr><th>Name</th><th>Email</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <span th:text="${user.name}"></span>
                            <a class="edit-link" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Edit</a>
                        </td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.admin} ? 'Admin' : 'User'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
