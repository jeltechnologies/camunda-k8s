spring:
  datasource:
    url: jdbc:h2:mem:camunda-demo-identity-provider;MODE=PostgreSQL
    username: sa
    password: ""

identity-provider:
  camunda-domain: identity-provider.example.com
  demo-user:
    name: Demo User
    email: demo@example.com
    password: demo
  clients:
    identity:
      secret: test-secret
      audience: camunda-identity-resource-server
    orchestration:
      secret: test-secret
      audience: orchestration-api
    connectors:
      secret: test-secret
      audience: orchestration-api
    optimize:
      secret: test-secret
      audience: optimize-api
    web-modeler:
      client-api-audience: web-modeler-api
      public-api-audience: web-modeler-public-api
