---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camunda-postgresql-data
  namespace: camunda
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: camunda-postgresql-init
  namespace: camunda
data:
  init-webmodeler-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "postgres" --dbname "postgres" <<-EOSQL
      CREATE USER "keycunda" WITH PASSWORD '$PG_PASSWORD_KEYCUNDA';
      CREATE DATABASE "keycunda" OWNER "keycunda";
      GRANT ALL PRIVILEGES ON DATABASE "keycunda" TO "keycunda";
      CREATE USER webmodeler WITH PASSWORD '$PG_PASSWORD_WEBMODELER';
      CREATE DATABASE "web-modeler" OWNER webmodeler;
      GRANT ALL PRIVILEGES ON DATABASE "web-modeler" TO webmodeler;
      CREATE USER orchestration WITH PASSWORD '$PG_PASSWORD_ORCHESTRATION';
      CREATE DATABASE orchestration OWNER orchestration;
      GRANT ALL PRIVILEGES ON DATABASE orchestration TO orchestration;
      CREATE USER identity WITH PASSWORD '$PG_PASSWORD_IDENTITY';
      CREATE DATABASE identity OWNER identity;
      GRANT ALL PRIVILEGES ON DATABASE identity TO identity;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: camunda-postgresql
  namespace: camunda
  labels:
    app: camunda-postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: camunda-postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: camunda-postgresql
  namespace: camunda
  labels:
    app: camunda-postgresql
spec:
  serviceName: camunda-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: camunda-postgresql
  template:
    metadata:
      labels:
        app: camunda-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:${PG_VERSION}
          ports:
            - containerPort: 5432
          env:
            # Passwords come from the camunda-credentials Secret, never from this manifest. The
            # PG_PASSWORD_* variables are read by the init script above and, via `kubectl exec`,
            # by 2-install-camunda-microk8s.sh and the seed-*/grant-* scripts, so the password
            # never has to appear on a command line.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: camunda-credentials, key: keycunda-postgresql-password}
            - name: PG_PASSWORD_KEYCUNDA
              valueFrom:
                secretKeyRef: {name: camunda-credentials, key: keycunda-postgresql-password}
            - name: PG_PASSWORD_WEBMODELER
              valueFrom:
                secretKeyRef: {name: camunda-credentials, key: webmodeler-postgresql-user-password}
            - name: PG_PASSWORD_ORCHESTRATION
              valueFrom:
                secretKeyRef: {name: camunda-credentials, key: orchestration-postgresql-password}
            - name: PG_PASSWORD_IDENTITY
              valueFrom:
                secretKeyRef: {name: camunda-credentials, key: identity-postgresql-password}
            - name: POSTGRES_DB
              value: "postgres"
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: camunda-postgresql-data
        - name: init-scripts
          configMap:
            name: camunda-postgresql-init
            defaultMode: 0755
