# Camunda 8.10 (Helm chart 15.x, e.g. HELM_CHART_VERSION=15.0.0) variant of
# template-values-camunda.yaml. 2-install-camunda-microk8s.sh picks this file over the 8.9 one
# whenever HELM_CHART_VERSION's major version is >= 15. Keep the two files in sync for anything
# that isn't version-specific - this one is a full copy of the 8.9 template, not a diff/overlay,
# because the chart's `identity.configuration` mechanism (and Helm values generally) don't support
# partial overrides of nested list/map structures - see the `identity.env` block below for a
# concrete case where that bit us. Diverge only where 8.10's chart or app behavior actually
# requires it, and comment every such spot with what breaks on the other version if you're not
# sure - these are easy to lose track of across a copy-paste.
#
# Aligned with chart 15.x defaults: only values that differ from `helm show values
# camunda/camunda-platform --version 15.0.0` are set, no deprecated keys are used except
# orchestration.security.authorizations.enabled (kept on purpose - see the comment there), and
# settings the chart has no Helm key for go through each
# component's `extraConfiguration` (Spring-imported, so it overrides the chart-generated
# application.yaml) rather than a hand-written replacement `configuration` block.
global:
  documentStore:
    activeStoreId: "local"
    type:
      inmemory:
        enabled: false
      local:
        enabled: true
        storeId: "LOCAL"
        class: "io.camunda.document.store.local.LocalDocumentStoreProvider"
        basePath: "/camunda-docs"

  identity:
    # GENERIC = talk to any standards-compliant OIDC provider instead of the bundled Keycloak.
    # See https://docs.camunda.io/docs/self-managed/deployment/helm/configure/authentication-and-authorization/generic-oidc-provider/
    # keycunda (template-keycunda.yaml) issues the tokens. Client IDs and audiences are the chart
    # defaults (identity: camunda-identity, optimize: optimize, orchestration: orchestration,
    # connectors: connectors, Hub: web-modeler) and match keycunda's fixed client set in
    # OidcClientsConfig.java - re-check with `helm show values` if you bump HELM_CHART_VERSION.
    # Orchestration's and Connectors' own client settings live under orchestration.security /
    # connectors.security - chart 15.x has no global.identity.auth.orchestration/connectors
    # client keys.
    auth:
      enabled: true
      type: "GENERIC"
      publicIssuerUrl: "https://${CAMUNDA_DOMAIN}/auth"
      issuerBackendUrl: "http://keycunda/auth"
      authUrl: "https://${CAMUNDA_DOMAIN}/auth/oauth2/authorize"
      tokenUrl: "http://keycunda/auth/oauth2/token"
      jwksUrl: "http://keycunda/auth/oauth2/jwks"
      identity:
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-identity-client-token"
        # Without this, Management Identity's own authorization DB never bootstraps an admin - its
        # default initialClaimName is "oid" (Microsoft Entra's claim), which our tokens never carry,
        # so no user ever matches and nobody gets any role/permission in Identity's own store. This
        # is what Camunda Hub actually checks via its `camunda.identity.base-url` call (separate
        # from orchestration.security.initialization, which only bootstraps Orchestration/Zeebe's
        # own RBAC store) - without it, Hub shows "Access denied to organization ..." /
        # "Could not fetch your shared resources" for every user, forever. Mirrors the chart's own
        # commented example for generic OIDC providers (`helm show values`, "Microsoft Entra example").
        initialClaimName: "preferred_username"
        initialClaimValue: "${DEMO_EMAIL}"
      # Camunda Hub (8.10's merger of Web Modeler and Console) still authenticates as the
      # "web-modeler" public (PKCE) client on keycunda - the chart's own values schema has no
      # client-secret field for it. `camundaHub` replaces the 8.9 `webModeler` key here (chart
      # 15.x reads camundaHub first and only falls back to webModeler); the 8.9 `console` block
      # is gone entirely - chart 15.x has no global.identity.auth.console and no Console client.
      camundaHub:
        clientId: "web-modeler"
        redirectUrl: "https://${CAMUNDA_DOMAIN}/modeler"
        clientApiAudience: "web-modeler-api"
        publicApiAudience: "web-modeler-public-api"
      optimize:
        redirectUrl: "https://${CAMUNDA_DOMAIN}/optimize"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-optimize-client-token"

  security:
    authentication:
      method: oidc

  # Chart 15.x stopped shipping ingress-nginx annotations as values defaults and injects them
  # through a deprecated compatibility shim instead (removed in chart 16). The shim is switched off
  # here and everything it used to inject is declared explicitly - on this Ingress and on
  # orchestration.ingress.grpc below - so the rendered Ingress objects are unchanged and nothing
  # breaks when the shim goes away.
  compatibility:
    nginx:
      renderAnnotations: false

  host: "${CAMUNDA_DOMAIN}"
  ingress:
    enabled: true
    className: public
    tls:
      enabled: true
      secretName: "tls-secret-${CAMUNDA_DOMAIN}"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-buffering: "on"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  # Fixes the PKIX/"unable to find valid certification path" crash-loop on orchestration (zeebe
  # gateway) and connectors that's specific to 8.10 (see the long comment above
  # orchestration.security.authentication.oidc below for the full trace and root cause). This is
  # the chart's own purpose-built mechanism for exactly this - global.tls.caBundle - not a
  # hand-rolled initContainer: it reuses each component's own image (already has keytool),
  # rebuilds a combined truststore (component's default cacerts + this CA) into an emptyDir at
  # /var/camunda/tls-truststore/cacerts, and wires JAVA_TOOL_OPTIONS to point at it - all
  # automatic once this secret reference is set, confirmed by reading
  # templates/orchestration/statefulset.yaml and templates/connectors/deployment.yaml (both
  # already call camundaPlatform.caBundleInitContainer/caBundleJavaToolOptionsEnv/
  # caBundleTruststoreVolumeMount unconditionally, gated only on this being non-empty - no
  # per-component wiring needed here). Reuses the existing self-signed leaf cert secret
  # (create-certifcate.sh, also referenced above at ingress.tls.secretName) instead of a separate
  # CA secret - keytool will happily import a self-signed leaf as a trusted entry, it doesn't
  # require a proper CA:true basicConstraint. autoRollout is deliberately left at its default
  # (false): it needs `get` on Secrets via Helm's `lookup` at upgrade time, which this install
  # flow's Helm identity may not have, and `create-certifcate.sh` regenerating the cert is a rare,
  # manual, already-visible action - a `kubectl rollout restart` on orchestration/connectors after
  # that is an acceptable manual step, not worth the extra RBAC surface.
  tls:
    caBundle:
      secret:
        existingSecret: "tls-secret-${CAMUNDA_DOMAIN}"
        existingSecretKey: "tls.crt"

identity:
  contextPath: "/identity"
  fullURL: "https://${CAMUNDA_DOMAIN}/identity"
  enabled: true
  # No `firstUser` block: users now live in keycunda, not in an Identity-managed Keycloak
  # realm. The first admin user is seeded by keycunda itself (DEMO_NAME/DEMO_EMAIL
  # /DEMO_PASSWORD in template-keycunda.yaml), not by this Helm chart.
  # Identity needs its own relational database only in GENERIC OIDC mode (in Keycloak mode its
  # authorization/mapping-rule data lived inside Keycloak's own realm instead) - confirmed by
  # `helm template` against this exact chart version, since neither the docs nor the values.yaml
  # comments call this out. Without it, Identity crashes on startup trying to build a JDBC
  # connection from entirely blank host/port/database defaults.
  externalDatabase:
    enabled: true
    host: "camunda-postgresql"
    username: "identity"
    database: "identity"
    secret:
      existingSecret: "camunda-credentials"
      existingSecretKey: "identity-postgresql-password"
  env:
    - name: IDENTITY_CLIENTID
      value: "camunda-identity"
    # Works around a startup crash that's specific to Identity 8.10.0-alpha4.2 (this chart line -
    # confirmed by extracting and decompiling the running identity.jar). Identity's own bundled
    # default application.yaml unconditionally defines one mapping rule - "OC Cluster Endpoint
    # Access", matching claim sub=service-account-<orchestration client id> - granting the role
    # "Web Modeler Public API - Cluster Ping". That role only actually gets created when Camunda
    # Hub cluster-ping is enabled (orchestration.hub.ping.endpoint /
    # global.identity.auth.orchestration.hubPingAuthorizationEnabled, both unset here, and
    # deliberately so - this is a single-box demo with no Camunda Hub connectivity): the chart's
    # own identity/configmap.yaml template gates that role behind the same condition, but never
    # correspondingly clears the mapping rule itself when the condition is false. Every restart
    # then dies in OidcMappingRuleInitializer (io.camunda.identity.impl.oidc.initializer,
    # confirmed via the identity pod's crash logs) with "appliedRoleNames.notFound", because it
    # tries to look up a role that was never created - CrashLoopBackOff on every attempt, not a
    # transient race (verified against 7 consecutive restarts).
    # IDENTITY_MAPPINGRULES_<index>_* env vars are Identity's documented way to define/override
    # mapping rules (see https://github.com/camunda/camunda-docs/issues/3990) - but ALL fields for
    # an index must be given, not just the broken one: the identity ConfigMap's own header comment
    # warns "it's not possible to mix between the configuration and environment variable for the
    # same object like arrays and maps", and this was confirmed the hard way - overriding only
    # APPLIEDROLENAMES_0 traded "appliedRoleNames.notFound" for a second crash ("The given id must
    # not be null"), because Spring Boot's relaxed binding doesn't merge one field from env vars
    # into the classpath YAML's entry at the same index - the env-var source, once it defines
    # anything at index 0, replaces that entire array element, leaving every field we didn't also
    # set as null. So this redeclares the whole entry (name/claim/operator/rule-type unchanged from
    # the jar default) and only actually changes the role. "Orchestration" is deliberately chosen
    # over any more powerful role (e.g. ManagementIdentity) - it's Orchestration's own client
    # mapping to its own role, so it adds no privilege beyond what that service account already has
    # via its direct M2M permission grant. If a future alpha/GA build seeds the missing role or
    # fixes the gap, this override becomes an inert no-op (still points at a rule/index that still
    # exists), not a new problem - safe to leave in place rather than re-conditionalize per patch
    # version. Verified end-to-end on the live cluster: identity.mapping_rules /
    # mapping_rules_applied_roles ended up with exactly "Default"->ManagementIdentity and
    # "OC Cluster Endpoint Access"->Orchestration, and the pod stayed at 1/1 Running (0 restarts).
    - name: IDENTITY_MAPPINGRULES_0_NAME
      value: "OC Cluster Endpoint Access"
    - name: IDENTITY_MAPPINGRULES_0_CLAIMNAME
      value: "sub"
    - name: IDENTITY_MAPPINGRULES_0_CLAIMVALUE
      value: "service-account-orchestration"
    - name: IDENTITY_MAPPINGRULES_0_OPERATOR
      value: "EQUALS"
    - name: IDENTITY_MAPPINGRULES_0_RULETYPE
      value: "ROLE"
    - name: IDENTITY_MAPPINGRULES_0_APPLIEDROLENAMES_0
      value: "Orchestration"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  extraVolumes:
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: camunda-docs
      mountPath: /camunda-docs

optimize:
  enabled: true
  contextPath: "/optimize"
  database:
    elasticsearch:
      enabled: true
      external: true
      url:
        host: "camunda-elasticsearch-master"
  env:
    - name: CAMUNDA_OPTIMIZE_ELASTICSEARCH_SETTINGS_INDEX_PREFIX
      value: "optimize-dev"
    - name: CAMUNDA_OPTIMIZE_ZEEBE_NAME
      value: "dev-zeebe"
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
      value: "https://${CAMUNDA_DOMAIN}/auth"
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
  extraVolumes:
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: camunda-docs
      mountPath: /camunda-docs

connectors:
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-connectors-client-token"
  contextPath: "/connectors"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  envFrom:
    - secretRef:
        name: connector-secrets
        optional: true
  env:
    - name: LOADER_PATH
      value: "/opt/custom/connectors"
    - name: CAMUNDA_CONNECTOR_SECRETRESOLVER_SECRETFILTER_MODE
      value: DISABLED
  extraVolumes:
    - name: custom-connectors
      persistentVolumeClaim:
        claimName: camunda-connectors-custom
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: custom-connectors
      mountPath: /opt/custom
    - name: camunda-docs
      mountPath: /camunda-docs

# 8.10: Camunda Hub replaces both Web Modeler and Console (camunda/hub image, same
# web-modeler-restapi/websockets workloads, WebSocket path derived as "<contextPath>-ws").
# `camundaHub.enabled` deploys Hub with the Console feature always on; the chart deep-merges
# `camundaHub.*` over the legacy `webModeler.*`, which still works but prints a deprecation
# warning. Settings must sit directly under `camundaHub`, never under camundaHub.webModeler /
# camundaHub.console (the chart fails the render).
#
# No hand-written `restapi.configuration` and no `restapi.clusters`: the chart generates Hub's
# whole application.yaml, including the cluster list - a "default-cluster" with orchestration,
# connectors, operate, tasklist, admin and optimize (each with its readiness URL, so Hub's
# Clusters page can report health) plus a separate "management-cluster" for Identity. 8.9's
# template still needs the hand-written version; see template-values-camunda.yaml.
camundaHub:
  enabled: true
  contextPath: "/modeler"
  restapi:
    externalDatabase:
      url: "jdbc:postgresql://camunda-postgresql:5432/web-modeler"
      username: "webmodeler"
      secret:
        existingSecret: "camunda-credentials"
        existingSecretKey: "webmodeler-postgresql-user-password"
    # Shared by restapi and websockets. Created once (random values) by
    # 2-install-camunda-microk8s.sh, instead of the chart's deprecated per-render auto-generation.
    pusher:
      secret:
        existingSecret: "camunda-hub-pusher"
        existingSecretKey: "app-secret"
      client:
        secret:
          existingSecret: "camunda-hub-pusher"
          existingSecretKey: "app-key"
    env:
      - name: CAMUNDA_MODELER_RESOURCE_IMPORT_ALLOW_PRIVATE_IP_ADDRESS
        value: "true"
      - name: FEATURE_AI_ENABLED
        value: "${OLLAMA_ENABLED}"
      - name: RESTAPI_BPMN_COPILOT_DEFAULT_LLM_PROVIDER
        value: OLLAMA
      - name: RESTAPI_FEEL_COPILOT_DEFAULT_LLM_PROVIDER
        value: OLLAMA
      - name: RESTAPI_FORM_COPILOT_DEFAULT_LLM_PROVIDER
        value: OLLAMA
      - name: RESTAPI_COPILOT_OLLAMA_DEFAULT_MODEL_ID
        value: "${OLLAMA_MODEL}"
      - name: RESTAPI_COPILOT_OLLAMA_BASE_URL
        value: "${OLLAMA_URL}"
      - name: CAMUNDA_MODELER_GITSYNC_GITLAB_BASEURL
        value: "${GITLAB_URL}"
    extraConfiguration:
      - file: demo-overrides.yaml
        content: |
          camunda:
            hub:
              # Required by the chart (replaces the deprecated restapi.mail.fromAddress key).
              mail:
                from-address: "noreply@example.com"
              oauth2:
                token:
                  # Hub has no separate claim for the display "name" field - whatever claim is
                  # configured here fills both "username" and the profile "name" shown in the UI.
                  # User matching itself is keyed off "sub" (iam_id), not this claim, so it's safe
                  # to point this at the free-text display name instead of the login identifier.
                  # The chart default "preferred_username" (our email claim) made the profile show
                  # the email in both the name and email fields instead of a real name.
                  username-claim: "name"
          # --- FIX (8.9+): Hub's restapi runs on Tomcat and owns the browser-facing login/session
          # flow. Tomcat does not trust X-Forwarded-Proto from the nginx ingress by default, so
          # with the chart's `https-only: true` it kept generating https redirects on a request it
          # believed was still plain HTTP -> redirect loop / ERR_TOO_MANY_REDIRECTS. `native`
          # tells Spring Boot to let Tomcat's built-in RemoteIpValve read
          # X-Forwarded-Proto/-Host/-Port/-For from the ingress and treat the connection as HTTPS.
          server:
            forward-headers-strategy: native
          zeebe:
            client:
              maxMetadataSize: 32768
    extraVolumes:
      - name: camunda-docs
        persistentVolumeClaim:
          claimName: camunda-docs-pvc
    extraVolumeMounts:
      - name: camunda-docs
        mountPath: /camunda-docs

orchestration:
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  contextPath: "/orchestration"
  ingress:
    grpc:
      enabled: true
      className: public
      host: "${ZEEBE_DOMAIN}"
      tls:
        enabled: true
        secretName: "tls-secret-${ZEEBE_DOMAIN}"
      # What chart 15.x's deprecated global.compatibility.nginx.renderAnnotations shim used to
      # inject on the gRPC Ingress - see global.compatibility above.
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
        nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  # On 8.10.0-alpha4.2 (chart 15.0.0-alpha4), with only `oidc.issuer` set (no explicit
  # authUrl/tokenUrl/jwksUrl - same as the working 8.9 config below), the gateway crash-loops with
  # PKIX path building failed / unable to find valid certification path, fetching
  # https://${CAMUNDA_DOMAIN}/auth/.well-known/openid-configuration and hitting our self-signed
  # cert (create-certifcate.sh), which the JVM's default trust store doesn't trust. Confirmed via
  # `kubectl logs --previous camunda-zeebe-0`: the call chain is
  # io.camunda.security.spring.oidc.ScopedJwtDecoderFactory.buildIssuerAwareDecoder ->
  # ScopedClientRegistrationFactory.createFromProviderMap -> Spring's
  # ClientRegistrations.fromOidcIssuerLocation, invoked from
  # PhysicalTenantHandlerFactory.build - a new-in-8.10 class name (multi-tenant/"topology" gateway
  # support). UPDATE: turns out this is not an 8.10-only code path after all - 8.9.14 crash-loops
  # the same way via a different class (WebSecurityConfig$OidcConfiguration
  # .clientRegistrationRepository, no multi-tenant "topology" involved), so orchestration's plain
  # OIDC client-registration bean has apparently always made this same outbound well-known-config
  # call; 8.10 just adds a second call site alongside it. connectors (io.camunda.client's
  # OAuthCredentialsProviderBuilder.fetchWellKnownConfiguration) fails identically for the same
  # reason. Fixed via global.tls.caBundle above (not here) - see that comment for how. The 8.9
  # template now carries the identical caBundle block for the same reason - see the comment there.
  security:
    authentication:
      method: oidc
      oidc:
        issuer: "https://${CAMUNDA_DOMAIN}/auth"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-orchestration-client-token"
    # Deliberately disabled (Camunda's default is enabled) so every keycunda user can use
    # Operate/Tasklist without per-user role grants. The ONE deprecated key this template still
    # uses on purpose (chart 15.x prints a DEPRECATION warning for it): moving it to
    # orchestration.extraConfiguration, as the warning suggests, would disable authorizations in
    # Orchestration itself, but the chart also copies this Helm value - and only this one - into
    # Hub's generated default-cluster (`authorizations.enabled`), which Hub's frontend uses after
    # every deploy to fetch the user's authorized components and show "grant authorizations in
    # Admin" hints. Migrated, Hub would claim authorizations are on while Orchestration has them
    # off. Revisit when chart 16 removes the key.
    authorizations:
      enabled: false
    # Camunda's own RBAC keys initial-admin assignment off orchestration.security.authentication
    # .usernameClaim (default: preferred_username). Our identity provider puts the user's email
    # there (see AuthorizationServerConfig's token customizer) - "demo"/"demo@demo.com" from the
    # chart's own defaults would never match a real login, so it's overridden here to line up
    # with the actual seeded admin (DEMO_EMAIL/DEMO_NAME/PASSWORD). Currently moot in practice
    # since authorizations are disabled (just above - no role checks are enforced yet), but wiring it correctly now avoids a silent mismatch if that's ever turned
    # on. The "connectors" user is a chart default, repeated here only because `users` is a list
    # (lists replace, they don't merge); the chart's defaultRoles.connectors entry is a map and
    # merges in untouched.
    initialization:
      users:
        - username: connectors
          password: connector
          name: Connector User
          email: connector@demo.com
        - username: "${DEMO_EMAIL}"
          password: "${PASSWORD}"
          name: "${DEMO_NAME}"
          email: "${DEMO_EMAIL}"
      defaultRoles:
        admin:
          users:
            - "${DEMO_EMAIL}"
  exporters:
    rdbms:
      enabled: true
  data:
    secondaryStorage:
      type: "rdbms"
      rdbms:
        url: "jdbc:postgresql://camunda-postgresql:5432/orchestration"
        username: "orchestration"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "orchestration-postgresql-password"
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
  # The chart's own orchestration/statefulset.yaml template already emits a JAVA_TOOL_OPTIONS env
  # var itself (combining orchestration.javaOpts with the global.tls.caBundle truststore options
  # above, since that's set) before appending orchestration.env verbatim - so a JAVA_TOOL_OPTIONS
  # entry under env here would be a *second* env var with the same key, which server-side apply
  # rejects outright ("duplicate entries for key"). javaOpts is the chart's own extension point for
  # this (per the "<component>.javaOpts (which the chart appends to, not replaces)" comment near
  # the top of the chart's values.yaml) - it's appended to the caBundle-derived value, not
  # env-appended separately, so it can't collide. Since it's a scalar string, not a merge-friendly
  # map, setting it here replaces the chart's default outright - so the default flags are repeated
  # verbatim alongside -Xss32m rather than lost.
  javaOpts: >-
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/usr/local/camunda/data
    -XX:ErrorFile=/usr/local/camunda/data/camunda_error%p.log
    -XX:+ExitOnOutOfMemoryError
    -Xss32m
  env:
    - name: SPRINGDOC_SWAGGERUI_ENABLED
      value: "${SWAGGER_ENABLED}"
    # 8.10-only: a new gateway-side "cluster-admin" API (io.camunda.authentication.clusteradmin -
    # confirmed by extracting camunda-authentication-8.10.0-alpha4.jar, no equivalent package
    # exists in the 8.9 chart line) gates /cluster/v2/** (including /cluster/v2/status, a richer
    # cluster health/status endpoint) behind ROLE_CLUSTER_ADMIN. With no
    # camunda.security.cluster-admin.oidc.* matcher configured, the gateway logs on every
    # startup: "No cluster-admin OIDC matchers configured ... every bearer token will be denied
    # on /cluster/v2/**" - and Hub's Clusters page (which forwards the logged-in user's own token,
    # BEARER_TOKEN cluster authentication) reported Zeebe as unhealthy as a result, even though
    # the broker/gateway itself was fully healthy (verified directly via
    # /orchestration/actuator/health and /orchestration/v2/topology). Confirmed fixed by calling
    # /orchestration/cluster/v2/status with the web-modeler user's own token: 403 before this env
    # var, 204 after.
    #
    # The list-of-objects binding target is `io.camunda.configuration.ClusterAdminClaim` (also
    # confirmed by extracting the jar - specifically configuration-8.10.0-alpha4.jar, NOT the
    # camunda-authentication one above, which has its own differently-named, unrelated runtime
    # ClusterAdminClaim/ClaimRule type built from this one at startup). It's a Java record with
    # fields `name`/`value` - NOT `claimName`/`claimValue` as the authentication jar's runtime
    # type would suggest, and easy to get wrong by decompiling the wrong jar (done twice here
    # before landing on the right one): a single "name;value" string throws
    # ConverterNotFoundException (no String converter registered for the list element type), and
    # CLAIMNAME/CLAIMVALUE indexed keys throw UnboundConfigurationPropertiesException (right
    # index, wrong field names) - both crash-loop the gateway, so get this exactly right before
    # changing it. Scoped to just the seeded admin via preferred_username=DEMO_EMAIL - the same
    # claim/value Identity's own initialClaimName/initialClaimValue bootstrap already uses to
    # identify that one admin - rather than the broader demo_user=true claim the "AllUsers"
    # mapping rule grants everyone, since cluster-admin is a materially more privileged
    # capability than baseline app access.
    - name: CAMUNDA_SECURITY_CLUSTERADMIN_OIDC_CLAIMS_0_NAME
      value: "preferred_username"
    - name: CAMUNDA_SECURITY_CLUSTERADMIN_OIDC_CLAIMS_0_VALUE
      value: "${DEMO_EMAIL}"
  extraVolumes:
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: camunda-docs
      mountPath: /camunda-docs
  extraConfiguration:
    - file: mcp-gateway.yaml
      content: |
        camunda:
          mcp:
            enabled: true
    # Replaces Helm keys chart 15.x deprecated (removed in chart 16) in favor of
    # orchestration.extraConfiguration: orchestration.exporters.camunda.enabled and
    # orchestration.security.authentication.oidc.redirectUrl.
    # - autoconfigure-camunda-exporter: no Elasticsearch/OpenSearch secondary storage here
    #   (Orchestration uses RDBMS); the chart reads this file's value to decide the exporter
    #   setting it renders.
    # - redirect URIs: the chart derives all three from oidc.redirectUrl (default
    #   http://localhost:8080), so they're set here against the public ingress URL instead. Side
    #   effect: Management Identity's own "Orchestration" application entry now shows root-url
    #   http://localhost:8080 - cosmetic only, since in GENERIC mode Identity never registers
    #   clients with the OIDC provider (keycunda's client set is fixed in OidcClientsConfig.java).
    - file: demo-overrides.yaml
      content: |
        camunda:
          security:
            authentication:
              oidc:
                redirect-uri: "https://${CAMUNDA_DOMAIN}/orchestration/sso-callback"
          data:
            secondary-storage:
              autoconfigure-camunda-exporter: false
          operate:
            identity:
              redirectRootUrl: "https://${CAMUNDA_DOMAIN}/orchestration/operate"
          tasklist:
            identity:
              redirectRootUrl: "https://${CAMUNDA_DOMAIN}/orchestration/tasklist"
