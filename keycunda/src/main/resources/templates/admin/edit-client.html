<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Keycunda</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .form-panel {
            max-width: 640px;
        }
        .form-panel label {
            margin-top: 1rem;
        }
        .form-panel label:first-of-type {
            margin-top: 0;
        }
        .note {
            font-size: 13px;
            color: #565656;
            margin-top: 0.3rem;
        }
        .checkbox-list {
            margin-top: 1rem;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.35rem;
        }
        .checkbox-row label {
            margin: 0;
            font-weight: 400;
        }
        .secret-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .secret-row .secret-value {
            flex: 1;
        }
        .button-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .btn-cancel {
            padding: 0.55rem 1rem;
            background: #ffffff;
            color: var(--gray-100);
            border: 1px solid var(--gray-20);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
        .secret-value {
            display: block;
            width: 100%;
            padding: 0.55rem 0.65rem;
            border: 1px solid var(--gray-20);
            background: var(--gray-10);
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 13px;
            white-space: nowrap;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/nav :: topbar('clients')}"></div>

    <div class="content">
        <div class="panel form-panel">
            <h1>Edit client</h1>
            <p class="message" th:if="${message}" th:text="${message}"></p>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <form method="post" th:action="@{/admin/clients/{id}/edit(id=${client.id})}">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" th:value="${client.name}" required="required" autofocus="autofocus"/>

                <label for="clientId">Client ID</label>
                <input type="text" id="clientId" th:value="${client.clientId}" readonly="readonly"/>
                <p class="note">The client ID cannot be changed after creation.</p>

                <label>Audience</label>
                <p class="note" style="margin-top: 0;">The resource server(s) this client's tokens are valid for.</p>
                <div class="checkbox-list">
                    <div class="checkbox-row" th:each="entry : ${knownAudiences}">
                        <input type="checkbox" th:id="${'aud-' + entry.value}" name="knownAudiences"
                               th:value="${entry.value}" th:checked="${selectedAudiences.contains(entry.value)}"/>
                        <label th:for="${'aud-' + entry.value}" th:text="${entry.key + ' (' + entry.value + ')'}"></label>
                    </div>
                </div>

                <label for="customAudience">Custom audience(s)</label>
                <input type="text" id="customAudience" name="customAudience" th:value="${customAudience}"/>
                <p class="note">
                    Space/comma-separated, for an audience not listed above (e.g. one added in a future Camunda version).
                </p>

                <label>Secret</label>
                <div class="secret-row">
                    <span class="secret-value" th:if="${client.secret}" th:text="${client.secret}"></span>
                    <span class="secret-value" th:unless="${client.secret}">Not available - click "Generate new".</span>
                    <button type="submit" class="btn-secondary"
                            th:formaction="@{/admin/clients/{id}/regenerate-secret(id=${client.id})}">Generate new</button>
                </div>

                <div class="button-row">
                    <button type="submit">OK</button>
                    <button type="submit" class="danger" th:formaction="@{/admin/clients/{id}/delete(id=${client.id})}">Remove</button>
                    <a class="btn-cancel" th:href="@{/admin/clients}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
