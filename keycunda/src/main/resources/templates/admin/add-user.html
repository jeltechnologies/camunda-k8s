<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda Demo - External Identity Provider</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/people.svg}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .form-panel {
            max-width: 420px;
        }
        .form-panel label {
            margin-top: 1rem;
        }
        .form-panel label:first-of-type {
            margin-top: 0;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1rem;
        }
        .checkbox-row label {
            margin: 0;
            font-weight: 400;
        }
        .note {
            font-size: 13px;
            color: #565656;
            margin-top: 0.3rem;
        }
        .button-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .btn-cancel {
            padding: 0.55rem 1rem;
            background: #ffffff;
            color: var(--gray-100);
            border: 1px solid var(--gray-20);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/nav :: topbar('users')}"></div>

    <div class="content">
        <div class="panel form-panel">
            <h1>Add user</h1>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <form method="post" th:action="@{/admin/users}">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required="required" autofocus="autofocus"/>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required="required"/>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required="required"/>

                <div class="checkbox-row">
                    <input type="checkbox" id="admin" name="admin" value="true"/>
                    <label for="admin">Admin</label>
                </div>


                <label th:if="${authorizationsEnabled}">Groups</label>
                <div class="checkbox-row" th:if="${authorizationsEnabled}" th:each="group : ${knownGroups}">
                    <input type="checkbox" name="groups" th:id="${'group-' + group}" th:value="${group}" checked="checked"/>
                    <label th:for="${'group-' + group}" th:text="${group}"></label>
                </div>
                <p class="note" th:if="${authorizationsEnabled}">A user can be in several groups; all are pre-checked, uncheck the ones this user should not have. Groups decide what the user may do in Camunda
                    (Operate, Tasklist, starting processes).</p>

                <div class="button-row">
                    <button type="submit">OK</button>
                    <a class="btn-cancel" th:href="@{/admin/users}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
