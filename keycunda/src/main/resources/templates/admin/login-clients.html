<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda Demo - External Identity Provider</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/people.svg}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .panel-header h1 { margin: 0; }
        .edit-link { font-size: 13px; color: var(--blue-60); text-decoration: none; }
        .edit-link:hover { text-decoration: underline; }
        .mono-list { margin: 0; padding-left: 1.1rem; }
        .mono-list li { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/nav :: topbar('login-clients')}"></div>
    <div class="content">
        <div class="panel">
            <div class="panel-header">
                <h1>Login clients</h1>
                <a class="btn" th:href="@{/admin/login-clients/new}">Add login client</a>
            </div>
            <p class="note">Web apps that log users in here and call Camunda as the user (authorization code with PKCE).
                For automation without a user, use API clients.</p>
            <p class="message" th:if="${message}" th:text="${message}"></p>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <table>
                <thead>
                    <tr><th>Client ID</th><th>Redirect URIs</th><th>Audience</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="client : ${clients}">
                        <td><code th:text="${client.clientId}"></code></td>
                        <td><ul class="mono-list"><li th:each="uri : ${client.redirectPatterns}" th:text="${uri}"></li></ul></td>
                        <td>
                            <ul class="mono-list" th:if="${client.audience}">
                                <li th:each="aud : ${#strings.listSplit(client.audience, ',')}" th:text="${#strings.trim(aud)}"></li>
                            </ul>
                            <span th:unless="${client.audience}">-</span>
                        </td>
                        <td><a class="edit-link" th:href="@{/admin/login-clients/{id}/edit(id=${client.id})}">Edit</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clients)}"><td colspan="4">No login clients yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
