<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <!-- Zero-JS "please wait" polling: keeps reloading this page every 2s while the apply is
         still running, stops on its own once the job reaches a terminal state. -->
    <meta th:if="${job != null and job.state.name() == 'RUNNING'}" http-equiv="refresh" content="2"/>
    <style>
        .apply-overlay {
            position: fixed;
            inset: 0;
            background: rgba(22, 22, 22, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .apply-overlay-card {
            background: #ffffff;
            border: 1px solid var(--gray-20);
            padding: 2.5rem 3rem;
            text-align: center;
            max-width: 420px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 1.25rem;
            border: 4px solid var(--gray-20);
            border-top-color: var(--blue-60);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .apply-overlay-card p {
            margin: 0;
            font-weight: 600;
            color: var(--gray-100);
        }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/nav :: topbar('secrets')}"></div>

    <div th:if="${job != null and job.state.name() == 'RUNNING'}" class="apply-overlay">
        <div class="apply-overlay-card">
            <div class="spinner"></div>
            <p th:text="${job.message}"></p>
        </div>
    </div>

    <div class="content">
        <div class="panel">
            <h1>Apply to cluster</h1>
            <p th:if="${job == null}">Nothing has been applied yet.</p>
            <p class="message" th:if="${job != null and job.state.name() == 'SUCCESS'}" th:text="${job.message}"></p>
            <p class="error" th:if="${job != null and job.state.name() == 'ERROR'}" th:text="${job.message}"></p>
            <a class="btn-secondary" th:href="@{/admin/secrets}">Back to Secrets</a>
        </div>
    </div>
</body>
</html>
