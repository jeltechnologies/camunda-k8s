<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Keycunda</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .form-panel {
            max-width: 640px;
        }
        .form-panel label {
            margin-top: 1rem;
        }
        .form-panel label:first-of-type {
            margin-top: 0;
        }
        .note {
            font-size: 13px;
            color: #565656;
            margin-top: 0.3rem;
        }
        textarea {
            width: 100%;
            min-height: 160px;
            padding: 0.55rem 0.65rem;
            border: 1px solid var(--gray-20);
            border-radius: 0;
            font-size: 13px;
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            background: #ffffff;
            color: var(--gray-100);
            resize: vertical;
        }
        textarea:focus {
            outline: 2px solid var(--blue-60);
            outline-offset: -2px;
        }
        .button-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .btn-cancel {
            padding: 0.55rem 1rem;
            background: #ffffff;
            color: var(--gray-100);
            border: 1px solid var(--gray-20);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/nav :: topbar('secrets')}"></div>

    <div class="content">
        <div class="panel form-panel">
            <h1>Add secret</h1>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <form method="post" th:action="@{/admin/secrets}">
                <label for="key">Key</label>
                <input type="text" id="key" name="key" th:value="${key}" required="required" autofocus="autofocus" pattern="[A-Za-z_][A-Za-z0-9_]*"/>
                <p class="note">
                    Letters, digits or "_", not starting with a digit - so it also works as a Kubernetes Secret
                    key and a .env / shell variable name. Must be unique.
                </p>

                <label for="value">Value</label>
                <textarea id="value" name="value" required="required" th:text="${value}"></textarea>
                <p class="note">Multi-line values (e.g. a service-account JSON key) are supported.</p>

                <div class="button-row">
                    <button type="submit">OK</button>
                    <a class="btn-cancel" th:href="@{/admin/secrets}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
