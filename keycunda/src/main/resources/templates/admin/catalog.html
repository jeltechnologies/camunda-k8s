<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Camunda</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .panel-header h1 {
            margin: 0;
        }
        .mode-toggle {
            display: flex;
            gap: 0;
        }
        .mode-toggle button {
            border-radius: 0;
        }
        .mode-toggle button.active {
            background: var(--blue-60);
            color: #ffffff;
        }
        .status-line {
            color: #565656;
            font-size: 14px;
            margin: 0 0 1.25rem;
        }
        .lead {
            max-width: 640px;
            line-height: 1.5;
        }
        .publish-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.25rem 0;
        }
        .advanced-only[hidden] {
            display: none;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: 1.25rem 0 0.75rem;
        }
        .toolbar input[type="text"] {
            max-width: 320px;
            margin: 0;
        }
        code {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 13px;
        }
        table {
            table-layout: fixed;
        }
        .col-check {
            width: 36px;
        }
        .col-name {
            width: 22%;
        }
        .col-id {
            width: 28%;
            word-break: break-all;
        }
        .col-version {
            width: 80px;
        }
        .col-catalog {
            width: 120px;
        }
        .col-docs {
            width: 60px;
        }
        .docs-link {
            font-size: 13px;
            color: var(--blue-60);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(22, 22, 22, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay[hidden] {
            display: none;
        }
        .modal-card {
            background: #ffffff;
            border: 1px solid var(--gray-20);
            padding: 2rem 2.5rem;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
        }
        .modal-card .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 1.25rem;
            border: 4px solid var(--gray-20);
            border-top-color: var(--blue-60);
            border-radius: 50%;
            animation: modal-spin 0.8s linear infinite;
        }
        @keyframes modal-spin {
            to {
                transform: rotate(360deg);
            }
        }
        .modal-message {
            margin: 0;
            font-weight: 600;
            color: var(--gray-100);
        }
        .modal-message.success {
            color: #1a7f37;
        }
        .modal-message.error {
            color: var(--orange-60);
        }
        .modal-card ul {
            text-align: left;
            font-size: 13px;
            margin: 0.5rem 0 1rem;
            padding-left: 1.25rem;
        }
        .modal-card h3 {
            text-align: left;
            font-size: 14px;
            margin: 1rem 0 0;
        }
        .modal-card .button-row {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.25rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/nav :: topbar('catalog')}"></div>

    <div id="modal-overlay" class="modal-overlay" hidden="hidden">
        <div class="modal-card"></div>
    </div>

    <div class="content">
        <div class="panel">
            <div class="panel-header">
                <h1>Catalog</h1>
                <div class="mode-toggle">
                    <button type="button" class="btn-secondary" id="mode-basic">Basic</button>
                    <button type="button" class="btn-secondary" id="mode-advanced">Advanced</button>
                </div>
            </div>

            <p class="error" th:if="${sourceError}" th:text="${sourceError}"></p>
            <p class="error" th:if="${hubError}" th:text="'Camunda Hub is not available yet: ' + ${hubError}"></p>

            <p class="lead">
                Connector templates let you integrate with external systems straight from the modeler.
                Publish them here to make them available in Camunda Hub.
            </p>
            <p class="status-line" th:unless="${sourceError}">
                <span th:text="${#lists.size(rows)}">0</span> connector templates in release
                <code th:text="${release}"></code>,
                <span id="published-count" th:text="${publishedCount}">0</span> already in the Catalog.
            </p>

            <div class="publish-row">
                <button type="button" class="btn" id="publish-button"
                        th:disabled="${sourceError != null or rows.isEmpty()}">Publish all standard connector templates</button>
            </div>

            <div class="advanced-only" hidden="hidden">
                <div class="toolbar">
                    <input type="text" id="filter" placeholder="Filter connector templates"/>
                    <button type="button" class="btn-secondary" id="select-all">Select all</button>
                    <button type="button" class="btn-secondary" id="select-none">Select none</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th class="col-check"></th>
                            <th class="col-name">Name</th>
                            <th>Description</th>
                            <th class="col-id">Connector template ID</th>
                            <th class="col-version">Version</th>
                            <th class="col-catalog">In Catalog</th>
                            <th class="col-docs">Docs</th>
                        </tr>
                    </thead>
                    <tbody id="template-rows">
                        <tr th:each="row : ${rows}" th:attr="data-id=${row.id}">
                            <td class="col-check">
                                <input type="checkbox" class="template-check" th:attr="data-id=${row.id}" th:checked="${row.published}"/>
                            </td>
                            <td class="col-name" th:text="${row.name}"></td>
                            <td th:text="${row.description}"></td>
                            <td class="col-id"><code th:text="${row.id}"></code></td>
                            <td class="col-version" th:text="${row.version}"></td>
                            <td class="col-catalog" th:text="${row.published} ? 'Version ' + ${row.publishedVersion} : '-'"></td>
                            <td class="col-docs">
                                <a class="docs-link" th:if="${!#strings.isEmpty(row.documentationRef)}"
                                   th:href="${row.documentationRef}" target="_blank" rel="noopener noreferrer">Docs</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="publish-row">
                    <button type="button" class="btn" id="publish-selected-button">Publish selected connector templates</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const CSRF_HEADER = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
        const CSRF_TOKEN = /*[[${_csrf.token}]]*/ '';
        const PLAN_URL = /*[[@{/admin/catalog/plan}]]*/ '/auth/admin/catalog/plan';
        const PUBLISH_URL = /*[[@{/admin/catalog/publish}]]*/ '/auth/admin/catalog/publish';
        const STATUS_URL = /*[[@{/admin/catalog/publish-status.json}]]*/ '/auth/admin/catalog/publish-status.json';
        const MODE_KEY = 'keycunda.catalog.mode';

        const modalOverlay = document.getElementById('modal-overlay');
        const modalCard = modalOverlay.querySelector('.modal-card');

        // ---- Basic / Advanced toggle (remembered per browser; works without storage) ----
        function storedMode() {
            try {
                return window.localStorage.getItem(MODE_KEY) === 'advanced' ? 'advanced' : 'basic';
            } catch (e) {
                return 'basic';
            }
        }

        function setMode(mode) {
            document.querySelector('.advanced-only').hidden = mode !== 'advanced';
            document.getElementById('publish-button').parentElement.hidden = mode === 'advanced';
            document.getElementById('mode-basic').classList.toggle('active', mode === 'basic');
            document.getElementById('mode-advanced').classList.toggle('active', mode === 'advanced');
            try {
                window.localStorage.setItem(MODE_KEY, mode);
            } catch (e) {
                // convenience only
            }
        }

        document.getElementById('mode-basic').addEventListener('click', function () {
            setMode('basic');
        });
        document.getElementById('mode-advanced').addEventListener('click', function () {
            setMode('advanced');
        });
        setMode(storedMode());

        // ---- Advanced table: filter and selection ----
        function visibleChecks() {
            return Array.prototype.filter.call(document.querySelectorAll('.template-check'), function (box) {
                return !box.closest('tr').hidden;
            });
        }

        function updateSelectedButton() {
            const count = document.querySelectorAll('.template-check:checked').length;
            const button = document.getElementById('publish-selected-button');
            button.textContent = 'Publish selected connector templates (' + count + ')';
        }

        document.getElementById('filter').addEventListener('input', function () {
            const needle = this.value.trim().toLowerCase();
            document.querySelectorAll('#template-rows tr').forEach(function (row) {
                row.hidden = needle !== '' && row.textContent.toLowerCase().indexOf(needle) === -1;
            });
        });
        document.getElementById('select-all').addEventListener('click', function () {
            visibleChecks().forEach(function (box) {
                box.checked = true;
            });
            updateSelectedButton();
        });
        document.getElementById('select-none').addEventListener('click', function () {
            visibleChecks().forEach(function (box) {
                box.checked = false;
            });
            updateSelectedButton();
        });
        document.querySelectorAll('.template-check').forEach(function (box) {
            box.addEventListener('change', updateSelectedButton);
        });
        updateSelectedButton();

        // ---- Modals ----
        function closeModal() {
            modalOverlay.hidden = true;
            modalCard.innerHTML = '';
        }

        /** Confirmation listing what the publish would replace, delete or unpublish. */
        function showConfirmModal(plan) {
            return new Promise(function (resolve) {
                const sections = [
                    ['Will be replaced (re-published)', plan.willReplace],
                    ['Will be removed from the Catalog', plan.willDelete],
                    ['Will be unpublished (not in this list)', plan.willUnpublish]
                ];
                modalCard.innerHTML = '<p class="modal-message">Publishing changes existing Catalog entries.</p>';
                sections.forEach(function (section) {
                    if (!section[1] || section[1].length === 0) {
                        return;
                    }
                    const heading = document.createElement('h3');
                    heading.textContent = section[0] + ' (' + section[1].length + ')';
                    const list = document.createElement('ul');
                    section[1].forEach(function (name) {
                        const item = document.createElement('li');
                        item.textContent = name;
                        list.appendChild(item);
                    });
                    modalCard.appendChild(heading);
                    modalCard.appendChild(list);
                });
                const row = document.createElement('div');
                row.className = 'button-row';
                row.innerHTML = '<button type="button" id="modal-confirm">Publish</button>' +
                    '<button type="button" class="btn-cancel" id="modal-cancel">Cancel</button>';
                modalCard.appendChild(row);
                modalOverlay.hidden = false;
                modalCard.querySelector('#modal-confirm').addEventListener('click', function () {
                    closeModal();
                    resolve(true);
                });
                modalCard.querySelector('#modal-cancel').addEventListener('click', function () {
                    closeModal();
                    resolve(false);
                });
            });
        }

        function showWaitModal(message) {
            modalCard.innerHTML = '<div class="spinner"></div><p class="modal-message"></p>';
            modalCard.querySelector('.modal-message').textContent = message;
            modalOverlay.hidden = false;
        }

        /** "Close" reloads the page, so the table shows what is now actually in the Catalog. */
        function showResultModal(kind, message) {
            modalCard.innerHTML = '<p class="modal-message"></p>' +
                '<div class="button-row"><button type="button" id="modal-close">Close</button></div>';
            const messageEl = modalCard.querySelector('.modal-message');
            messageEl.textContent = message;
            messageEl.classList.add(kind);
            modalOverlay.hidden = false;
            modalCard.querySelector('#modal-close').addEventListener('click', function () {
                window.location.reload();
            });
        }

        // ---- Publish: ask for the plan, confirm if needed, start the job, poll its status ----
        function postJson(url, body) {
            const headers = {'Content-Type': 'application/json'};
            headers[CSRF_HEADER] = CSRF_TOKEN;
            return fetch(url, {method: 'POST', headers: headers, body: JSON.stringify(body)});
        }

        function pollStatus() {
            fetch(STATUS_URL)
                .then(function (resp) {
                    return resp.json();
                })
                .then(function (job) {
                    if (job.state === 'RUNNING' || job.state === 'NONE') {
                        if (job.message) {
                            showWaitModal(job.message);
                        }
                        setTimeout(pollStatus, 1500);
                        return;
                    }
                    showResultModal(job.state === 'SUCCESS' ? 'success' : 'error', job.message);
                })
                .catch(function () {
                    setTimeout(pollStatus, 1500);
                });
        }

        function publish(request) {
            showWaitModal('Checking the Catalog...');
            postJson(PLAN_URL, request)
                .then(function (resp) {
                    return resp.json().then(function (body) {
                        return {ok: resp.ok, body: body};
                    });
                })
                .then(function (result) {
                    if (!result.ok) {
                        showResultModal('error', result.body.error || 'Could not check the Catalog.');
                        return null;
                    }
                    if (result.body.publish === 0 && !result.body.needsConfirmation) {
                        showResultModal('error', 'Nothing to publish.');
                        return null;
                    }
                    if (!result.body.needsConfirmation) {
                        return true;
                    }
                    closeModal();
                    return showConfirmModal(result.body);
                })
                .then(function (go) {
                    if (go === null) {
                        return;
                    }
                    if (!go) {
                        return;
                    }
                    showWaitModal('Publishing connector templates...');
                    return postJson(PUBLISH_URL, request).then(function (resp) {
                        if (resp.ok) {
                            pollStatus();
                        } else {
                            showResultModal('error', 'Failed to start publishing.');
                        }
                    });
                })
                .catch(function () {
                    showResultModal('error', 'Failed to publish.');
                });
        }

        document.getElementById('publish-button').addEventListener('click', function () {
            publish({mode: 'all', selectedIds: []});
        });
        document.getElementById('publish-selected-button').addEventListener('click', function () {
            const ids = Array.prototype.map.call(document.querySelectorAll('.template-check:checked'), function (box) {
                return box.getAttribute('data-id');
            });
            publish({mode: 'selection', selectedIds: ids});
        });
    </script>
</body>
</html>
