<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Keycunda</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link rel="stylesheet" th:href="@{/css/camunda.css}"/>
    <style>
        .form-panel {
            max-width: 420px;
        }
        .form-panel label {
            margin-top: 1rem;
        }
        .form-panel label:first-of-type {
            margin-top: 0;
        }
        .note {
            font-size: 13px;
            color: #565656;
            margin-top: 0.3rem;
        }
        .button-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .btn-cancel {
            padding: 0.55rem 1rem;
            background: #ffffff;
            color: var(--gray-100);
            border: 1px solid var(--gray-20);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/nav :: topbar('users')}"></div>

    <div class="content">
        <div class="panel form-panel">
            <h1>Edit user</h1>
            <p class="error" th:if="${error}" th:text="${error}"></p>
            <form method="post" th:action="@{/admin/users/{id}/edit(id=${user.id})}">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" th:value="${user.name}" required="required" autofocus="autofocus"/>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${user.email}" required="required"
                       th:readonly="${user.defaultAdmin}"/>
                <p class="note" th:if="${user.defaultAdmin}">
                    This is the default admin user created during installation - its email is the login identity
                    other Camunda components (Web Modeler included) key on, so it cannot be changed here.
                </p>

                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword"
                       placeholder="leave blank to keep current password"/>

                <div class="button-row">
                    <button type="submit">OK</button>
                    <button type="submit" class="danger" th:unless="${user.defaultAdmin}"
                            th:formaction="@{/admin/users/{id}/delete(id=${user.id})}">Remove</button>
                    <a class="btn-cancel" th:href="@{/admin/users}">Cancel</a>
                </div>
                <p class="note" th:if="${user.defaultAdmin}">
                    The default admin user cannot be removed.
                </p>
            </form>
        </div>
    </div>
</body>
</html>
