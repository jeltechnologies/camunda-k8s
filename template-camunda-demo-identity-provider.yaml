---
apiVersion: v1
kind: Service
metadata:
  name: camunda-demo-identity-provider
  namespace: jeltechnologies
  labels:
    app: camunda-demo-identity-provider
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: camunda-demo-identity-provider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camunda-demo-identity-provider
  namespace: jeltechnologies
  labels:
    app: camunda-demo-identity-provider
spec:
  replicas: 2
  selector:
    matchLabels:
      app: camunda-demo-identity-provider
  template:
    metadata:
      labels:
        app: camunda-demo-identity-provider
    spec:
      containers:
        - name: camunda-demo-identity-provider
          image: ${IDENTITY_PROVIDER_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: CAMUNDA_DOMAIN
              value: "${CAMUNDA_DOMAIN}"
            # camunda-postgresql lives in the "camunda" namespace - this component is external to
            # it, so it's a cross-namespace reference (<service>.<namespace>), not the short form.
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://camunda-postgresql.camunda:5432/camunda-demo-identity-provider"
            - name: SPRING_DATASOURCE_USERNAME
              value: "camunda-demo-identity-provider"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-provider-credentials
                  key: postgresql-password
            - name: DEMO_NAME
              value: "${DEMO_NAME}"
            - name: DEMO_EMAIL
              value: "${DEMO_EMAIL}"
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-provider-credentials
                  key: postgresql-password
            # A Secret can only be referenced by a pod in its own namespace, so this component
            # gets its own "identity-provider-credentials" Secret (jeltechnologies namespace)
            # instead of directly referencing "camunda-credentials" (camunda namespace) - both
            # are populated from the same $PASSWORD by 2-install-camunda-microk8s.sh.
            - name: IDENTITY_IDENTITY_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-provider-credentials
                  key: identity-identity-client-token
            - name: IDENTITY_ORCHESTRATION_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-provider-credentials
                  key: identity-orchestration-client-token
            - name: IDENTITY_CONNECTORS_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-provider-credentials
                  key: identity-connectors-client-token
            - name: IDENTITY_OPTIMIZE_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-provider-credentials
                  key: identity-optimize-client-token
            - name: IDENTITY_PROVIDER_JWT_SIGNING_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: camunda-identity-provider-signing-key
                  key: private-key.pem
          resources:
            requests:
              cpu: "50m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
