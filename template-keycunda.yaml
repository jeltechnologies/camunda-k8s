---
apiVersion: v1
kind: Service
metadata:
  name: keycunda
  namespace: camunda
  labels:
    app: keycunda
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: keycunda
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycunda
  namespace: camunda
  labels:
    app: keycunda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycunda
  template:
    metadata:
      labels:
        app: keycunda
    spec:
      # Grants just enough Kubernetes API access for Secrets Management > "Apply to cluster"
      # (secret/ClusterSecretsApplier.java) - see template-keycunda-rbac.yaml.
      serviceAccountName: keycunda
      containers:
        - name: keycunda
          image: ${KEYCUNDA_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: CAMUNDA_DOMAIN
              value: "${CAMUNDA_DOMAIN}"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://camunda-postgresql:5432/keycunda"
            - name: SPRING_DATASOURCE_USERNAME
              value: "keycunda"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camunda-credentials
                  key: keycunda-postgresql-password
            - name: DEMO_NAME
              value: "${DEMO_NAME}"
            - name: DEMO_EMAIL
              value: "${DEMO_EMAIL}"
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camunda-credentials
                  key: keycunda-postgresql-password
            - name: IDENTITY_IDENTITY_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: camunda-credentials
                  key: identity-identity-client-token
            - name: IDENTITY_ORCHESTRATION_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: camunda-credentials
                  key: identity-orchestration-client-token
            - name: IDENTITY_CONNECTORS_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: camunda-credentials
                  key: identity-connectors-client-token
            - name: IDENTITY_OPTIMIZE_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: camunda-credentials
                  key: identity-optimize-client-token
            - name: KEYCUNDA_JWT_SIGNING_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: keycunda-signing-key
                  key: private-key.pem
          resources:
            requests:
              cpu: "50m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
