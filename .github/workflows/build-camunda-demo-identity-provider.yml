name: Build camunda-demo-identity-provider

on:
  push:
    branches: [main]
    paths:
      - "camunda-demo-identity-provider/**"
      - ".github/workflows/build-camunda-demo-identity-provider.yml"
    tags:
      - "identity-provider-v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tag
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/camunda-demo-identity-provider" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/identity-provider-v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/identity-provider-v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: camunda-demo-identity-provider
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
