global:
  documentStore:
    activeStoreId: "local"
    type:
      aws:
        enabled: false
      gcp:
        enabled: false
      inmemory:
        enabled: false
      local:
        enabled: true
        storeId: "LOCAL"
        class: "io.camunda.document.store.local.LocalDocumentStoreProvider"
        basePath: "/camunda-docs"

  identity:
    # GENERIC = talk to any standards-compliant OIDC provider instead of the bundled Keycloak.
    # See https://docs.camunda.io/docs/self-managed/deployment/helm/configure/authentication-and-authorization/generic-oidc-provider/
    # camunda-demo-identity-provider (template-camunda-demo-identity-provider.yaml) issues the tokens. Client IDs/audiences below
    # were verified against `helm show values camunda/camunda-platform --version 14.7.0` - re-check
    # if you bump HELM_CHART_VERSION, since field names have moved between chart versions before
    # (e.g. orchestration.security.authentication.oidc.issuer, not "issuerUrl").
    auth:
      enabled: true
      type: "GENERIC"
      publicIssuerUrl: "https://${CAMUNDA_DOMAIN}/auth"
      issuerBackendUrl: "http://camunda-demo-identity-provider/auth"
      authUrl: "https://${CAMUNDA_DOMAIN}/auth/oauth2/authorize"
      tokenUrl: "http://camunda-demo-identity-provider/auth/oauth2/token"
      jwksUrl: "http://camunda-demo-identity-provider/auth/oauth2/jwks"
      identity:
        clientId: "camunda-identity"
        audience: "camunda-identity-resource-server"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-identity-client-token"
        # Without this, Management Identity's own authorization DB never bootstraps an admin - its
        # default initialClaimName is "oid" (Microsoft Entra's claim), which our tokens never carry,
        # so no user ever matches and nobody gets any role/permission in Identity's own store. This
        # is what Web Modeler actually checks via its `identity.base-url` call below (separate from
        # orchestration.security.initialization, which only bootstraps Orchestration/Zeebe's own
        # RBAC store) - without it, Web Modeler shows "Access denied to organization ..." /
        # "Could not fetch your shared resources" for every user, forever. Mirrors the chart's own
        # commented example for generic OIDC providers (`helm show values`, "Microsoft Entra example").
        initialClaimName: "preferred_username"
        initialClaimValue: "${DEMO_EMAIL}"
      # web-modeler is a public (PKCE) client on camunda-demo-identity-provider - the chart's own values schema has
      # no client-secret field for it either, confirmed against the real camunda-platform 14.7.0
      # chart defaults (`helm show values camunda/camunda-platform --version 14.7.0`).
      webModeler:
        clientId: "web-modeler"
        redirectUrl: "https://${CAMUNDA_DOMAIN}/modeler"
        clientApiAudience: "web-modeler-api"
        publicApiAudience: "web-modeler-public-api"
      console:
        clientId: "console"
        audience: "console-api"
        redirectUrl: "https://${CAMUNDA_DOMAIN}/console"
      optimize:
        clientId: "optimize"
        redirectUrl: "https://${CAMUNDA_DOMAIN}/optimize"
        audience: "optimize-api"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-optimize-client-token"
      orchestration:
        clientId: "orchestration"
        redirectUrl: "https://${CAMUNDA_DOMAIN}/orchestration"
        audience: "orchestration-api"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-orchestration-client-token"
      connectors:
        clientId: "orchestration"
        audience: "orchestration-api"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-connectors-client-token"

  security:
    authentication:
      method: oidc

  host: "${CAMUNDA_DOMAIN}"
  ingress:
    enabled: true
    className: public
    tls:
      enabled: true
      secretName: "tls-secret-${CAMUNDA_DOMAIN}"
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"


identity:
  contextPath: "/identity"
  fullURL: "https://${CAMUNDA_DOMAIN}/identity"
  enabled: true
  # No `firstUser` block: users now live in camunda-demo-identity-provider, not in an Identity-managed Keycloak
  # realm. The first admin user is seeded by camunda-demo-identity-provider itself (DEMO_NAME/DEMO_EMAIL
  # /DEMO_PASSWORD in template-camunda-demo-identity-provider.yaml), not by this Helm chart.
  # Identity needs its own relational database only in GENERIC OIDC mode (in Keycloak mode its
  # authorization/mapping-rule data lived inside Keycloak's own realm instead) - confirmed by
  # `helm template` against this exact chart version, since neither the docs nor the values.yaml
  # comments call this out. Without it, Identity crashes on startup trying to build a JDBC
  # connection from entirely blank host/port/database defaults.
  externalDatabase:
    enabled: true
    host: "camunda-postgresql"
    port: 5432
    username: "identity"
    database: "identity"
    secret:
      existingSecret: "camunda-credentials"
      existingSecretKey: "identity-postgresql-password"
  env:
    - name: IDENTITY_CLIENTID
      value: "camunda-identity"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  extraVolumes:
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: camunda-docs
      mountPath: /camunda-docs

optimize:
  enabled: true
  contextPath: "/optimize"
  database:
    elasticsearch:
      enabled: true
      external: true
      url:
        protocol: "http"
        host: "camunda-elasticsearch-master"
        port: 9200
  env:
    - name: CAMUNDA_OPTIMIZE_ELASTICSEARCH_SETTINGS_INDEX_PREFIX
      value: "optimize-dev"
    - name: CAMUNDA_OPTIMIZE_ZEEBE_NAME
      value: "dev-zeebe"
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
      value: "https://${CAMUNDA_DOMAIN}/auth"
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
  extraVolumes:
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: camunda-docs
      mountPath: /camunda-docs

connectors:
  enabled: true
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-connectors-client-token"
  contextPath: "/connectors"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  env:
    - name: LOADER_PATH
      value: "/opt/custom/connectors"
  extraVolumes:
    - name: custom-connectors
      persistentVolumeClaim:
        claimName: camunda-connectors-custom
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: custom-connectors
      mountPath: /opt/custom
    - name: camunda-docs
      mountPath: /camunda-docs

webModeler:
  enabled: true
  contextPath: "/modeler"
  restapi:
    externalDatabase:
      url: "jdbc:postgresql://camunda-postgresql:5432/web-modeler"
      username: "webmodeler"
      secret:
        existingSecret: "camunda-credentials"
        existingSecretKey: "webmodeler-postgresql-user-password"
    mail:
      fromAddress: noreply@example.com
    clusters:
      - id: "default-cluster"
        name: "camunda-zeebe"
        version: "${CAMUNDA_APP_VERSION}"
        authentication: "BEARER_TOKEN"
        authorizations:
          enabled: false
        url:
          grpc: "grpc://camunda-zeebe-gateway.camunda.svc.cluster.local:26500"
          rest: "http://camunda-zeebe-gateway.camunda.svc.cluster.local:8080/orchestration"
          web-app: "https://${CAMUNDA_DOMAIN}"
    env:
      - name: CAMUNDA_MODELER_RESOURCE_IMPORT_ALLOW_PRIVATE_IP_ADDRESS
        value: "true"
      - name: FEATURE_AI_ENABLED
        value: "${OLLAMA_ENABLED}"
      - name: RESTAPI_BPMN_COPILOT_DEFAULT_LLM_PROVIDER
        value: OLLAMA
      - name: RESTAPI_FEEL_COPILOT_DEFAULT_LLM_PROVIDER
        value: OLLAMA
      - name: RESTAPI_FORM_COPILOT_DEFAULT_LLM_PROVIDER
        value: OLLAMA
      - name: RESTAPI_COPILOT_OLLAMA_DEFAULT_MODEL_ID
        value: "${OLLAMA_MODEL}"
      - name: RESTAPI_COPILOT_OLLAMA_BASE_URL
        value: "${OLLAMA_URL}"
      - name: CAMUNDA_MODELER_GITSYNC_GITLAB_BASEURL
        value: "${GITLAB_URL}"
    configuration: |
      # This block is Web Modeler's own internal Spring config, passed straight through. No
      # client-secret is set here on purpose: camunda-demo-identity-provider registers "web-modeler" as a public
      # (PKCE) client, matching the chart's own values schema, which has no secret field for it.
      camunda:
        identity:
          base-url: "http://camunda-identity:80/identity"
          issuer: "https://${CAMUNDA_DOMAIN}/auth"
          issuerBackendUrl: "http://camunda-demo-identity-provider/auth"
          type: "GENERIC"

        modeler:
          feature:
            play-enabled: "true"

          security:
            jwt:
              issuer:
                backend-url: "http://camunda-demo-identity-provider/auth"
              audience:
                internal-api: "web-modeler-api"
                public-api: "web-modeler-public-api"

          mail:
            from-address: "noreply@example.com"
            from-name: "Camunda 8"

          oauth2:
            client-id: "web-modeler"
            token:
              username-claim: "preferred_username"

          pusher:
            host: "camunda-web-modeler-websockets"
            port: "8060"
            app-id: "web-modeler-app"
            key: "web-modeler-app-key"
            secret: "web-modeler-app-secret"
            client:
              host: "${CAMUNDA_DOMAIN}"
              port: "443"
              path: "/modeler-ws"
              force-tls: "true"

          server:
            url: "https://${CAMUNDA_DOMAIN}/modeler"
            https-only: "true"
          clusters:
            - authentication: BEARER_TOKEN
              authorizations:
                enabled: false
              id: default-cluster
              name: camunda-zeebe
              url:
                grpc: grpc://camunda-zeebe-gateway.camunda.svc.cluster.local:26500
                rest: http://camunda-zeebe-gateway.camunda.svc.cluster.local:8080/orchestration
                web-app: https://${CAMUNDA_DOMAIN}
              version: ${CAMUNDA_APP_VERSION}

      spring:
        datasource:
          url: "jdbc:postgresql://camunda-postgresql:5432/web-modeler"
          username: "webmodeler"

        mail:
          host: ""
          port: 587
          properties:
            mail.smtp.auth: false
            mail.smtp.starttls.enable: true
            mail.smtp.starttls.required: true

        security:
          oauth2:
            resourceserver:
              jwt:
                issuer-uri: "https://${CAMUNDA_DOMAIN}/auth"
                jwk-set-uri: "http://camunda-demo-identity-provider/auth/oauth2/jwks"

        servlet:
          multipart:
            max-file-size: "10MB"
            max-request-size: "10MB"

      # --- FIX (8.9): Web Modeler restapi now runs on Tomcat instead of Undertow,
      # and it also owns the browser-facing login/session flow that used to live
      # in the removed "webapp" component. Tomcat does not trust X-Forwarded-Proto
      # from the nginx ingress by default the way Undertow did, so with
      # `https-only: true` above it kept generating https redirects on a request
      # it believed was still plain HTTP -> redirect loop / ERR_TOO_MANY_REDIRECTS.
      # `native` tells Spring Boot to let Tomcat's built-in RemoteIpValve read
      # X-Forwarded-Proto/-Host/-Port/-For from the ingress and treat the
      # connection as HTTPS correctly.
      server:
        servlet:
          context-path: "/modeler"
        forward-headers-strategy: native

      management:
        server:
          base-path: "/modeler"

      logging:
        level:
          io.camunda.modeler: INFO
          io.grpc: INFO

      zeebe:
        client:
          maxMetadataSize: 32768

    extraVolumes:
      - name: camunda-docs
        persistentVolumeClaim:
          claimName: camunda-docs-pvc
    extraVolumeMounts:
      - name: camunda-docs
        mountPath: /camunda-docs
  websockets:
    contextPath: "/modeler-ws"
    pusher:
      app-id: "web-modeler-app"
      key: "web-modeler-app-key"
      secret: "web-modeler-app-secret"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi

orchestration:
  enabled: true
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  contextPath: "/orchestration"
  ingress:
    grpc:
      enabled: true
      className: public
      host: "${ZEEBE_DOMAIN}"
      tls:
        enabled: true
        secretName: "tls-secret-${ZEEBE_DOMAIN}"
  security:
    authentication:
      unprotectedApi: false
      method: oidc
      oidc:
        redirectUrl: "https://${CAMUNDA_DOMAIN}/orchestration"
        issuer: "https://${CAMUNDA_DOMAIN}/auth"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-orchestration-client-token"
    authorizations:
      enabled: false
    # Camunda's own RBAC keys initial-admin assignment off orchestration.security.authentication
    # .usernameClaim (default: preferred_username). Our identity provider puts the user's email
    # there (see AuthorizationServerConfig's token customizer) - "demo"/"demo@demo.com" from the
    # chart's own defaults would never match a real login, so it's overridden here to line up
    # with the actual seeded admin (DEMO_EMAIL/DEMO_NAME/PASSWORD). Currently moot in practice
    # since authorizations.enabled is false above (no role checks are enforced yet), but wiring
    # it correctly now avoids a silent mismatch if that's ever turned on. The "connectors" user
    # and client entries are chart defaults, left as-is.
    initialization:
      users:
        - username: connectors
          password: connector
          name: Connector User
          email: connector@demo.com
        - username: "${DEMO_EMAIL}"
          password: "${PASSWORD}"
          name: "${DEMO_NAME}"
          email: "${DEMO_EMAIL}"
      defaultRoles:
        admin:
          users:
            - "${DEMO_EMAIL}"
        connectors:
          users:
            - connectors
          clients:
            - connectors
  exporters:
    camunda:
      enabled: false
    rdbms:
      enabled: true
  data:
    secondaryStorage:
      type: "rdbms"
      rdbms:
        url: "jdbc:postgresql://camunda-postgresql:5432/orchestration"
        username: "orchestration"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "orchestration-postgresql-password"
  index:
    prefix: dev-camunda
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
  env:
    - name: SPRINGDOC_SWAGGERUI_ENABLED
      value: "${SWAGGER_ENABLED}"
  extraVolumes:
    - name: camunda-docs
      persistentVolumeClaim:
        claimName: camunda-docs-pvc
  extraVolumeMounts:
    - name: camunda-docs
      mountPath: /camunda-docs
  extraConfiguration:
    - file: mcp-gateway.yaml
      content: |
        camunda:
          mcp:
            enabled: true

console:
  enabled: true
  contextPath: "/console"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
